# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get the latest FT PWA release
        run: |
          RESPONSE=$(curl --request GET --url "https://api.github.com/repos/MarmadileManteater/FreeTubeCordova/releases" --header "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")
          echo $RESPONSE
          FT_DOWNLOAD_URL=$(echo $RESPONSE | jq '.[0].assets[1].browser_download_url')
          curl -L --request GET --url ${FT_DOWNLOAD_URL:1:-1} --header "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ftc.zip
      - name: 🤐 Unzip FreeTubeCordova artifact 
        run: |
          mkdir ./pages
          unzip -qq ./ftc.zip -d ./pages/freetube
          
      - name: Make hrefs in FT pwa absolute links
        run: |
          sed -i -e 's@href="@href="/freetube/@g' ./pages/freetube/index.html
          sed -i -e 's@src="@src="/freetube/@g' ./pages/freetube/index.html

      - name: 👩‍🔧 Install dependencies
        run: |
          pnpm install
      
      - name: 🚧 Setup the monorepo
        run: |
          pnpm run setup

      - name: 🏗 Build the website
        run: |
          cd ./websites/personal-site
          pnpm astro build
          
      - name: Rename artifact folder
        run: |
          mv ./websites/personal-site/dist/* ./pages
          
      - name: 🚚 Move old javascript link pages into output
        run: |
          mkdir ./pages/javascriptlink
          mv javascriptlink/* ./pages/javascriptlink
          
      - name: 🤐 Zip up build directory for 🏎faster uploads
        uses: montudor/action-zip@v1
        with:
          args: zip -r pages.zip . -i ./pages/*
    
      - name: 📦 Publish artifact
        uses: actions/upload-artifact@v3
        with:
          name: MarmadileManteater.github.io
          path: pages.zip
          
