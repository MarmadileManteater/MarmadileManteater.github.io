# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: 🚚 Move files into place
        run: |
          export SITE_URL="https://marmadilemanteater.dev"
          bash ./scripts/build.sh ./src ./pages --posts
          
      - name: 🤐 Zip up build directory for 🏎faster uploads
        uses: montudor/action-zip@v1
        with:
          args: zip -r pages.zip . -i ./pages/*
    
      - name: 📦 Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarmadileManteater.github.io
          path: pages.zip

      - name: Setup Pages
        uses: actions/configure-pages@v3
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          # Upload entire repository
          path: './pages/'
    
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5